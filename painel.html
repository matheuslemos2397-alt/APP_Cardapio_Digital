<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1c1e" />
  <title>Painel da Loja — Pedidos ao vivo</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #12100e; color: #f2efe9;
      min-height: 100dvh;
    }
    .topo {
      position: sticky; top: 0; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 14px;
      background: #1c1a17; border-bottom: 1px solid #2e2a24;
    }
    .topo h1 { font-size: 1.15rem; }
    .topo .ao-vivo {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.78rem; color: #9a958c;
    }
    .topo .ao-vivo::before {
      content: ""; width: 8px; height: 8px; border-radius: 50%;
      background: #e63946; animation: pulsar 1.4s infinite;
    }
    @keyframes pulsar { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

    .pedidos {
      display: flex; flex-direction: column; gap: 14px;
      padding: 16px; max-width: 720px; margin: 0 auto;
    }
    .pedido {
      background: #1c1a17; border: 1px solid #2e2a24;
      border-radius: 18px; padding: 16px;
      animation: aparecer 0.3s ease;
    }
    @keyframes aparecer { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .pedido__cab {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      margin-bottom: 8px;
    }
    .pedido__codigo { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.05em; }
    .badge {
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      padding: 5px 12px; border-radius: 999px; white-space: nowrap;
    }
    .badge--recebido { background: #3a3325; color: #ffc94d; }
    .badge--preparo { background: #25324a; color: #7db2ff; }
    .badge--a_caminho { background: #24382a; color: #5fd68b; }
    .badge--entregue { background: #2b2b2b; color: #9a958c; }
    .pedido__info { font-size: 0.88rem; color: #c8c3ba; line-height: 1.5; }
    .pedido__info strong { color: #f2efe9; }
    .pedido__itens {
      margin: 10px 0; padding: 10px 12px;
      background: #12100e; border-radius: 12px;
      font-size: 0.85rem; color: #c8c3ba;
    }
    .pedido__total { font-size: 1.05rem; font-weight: 800; color: #5fd68b; }
    .pedido__acoes { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .pedido__acoes button {
      flex: 1; min-width: 130px;
      border: none; border-radius: 12px; padding: 12px;
      font-size: 0.88rem; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: .15s;
    }
    .pedido__acoes button:active { transform: scale(.97); }
    .btn-preparo { background: #25324a; color: #7db2ff; }
    .btn-caminho { background: #24382a; color: #5fd68b; }
    .btn-entregue { background: #2b2b2b; color: #9a958c; }
    .btn-whatsapp {
      flex: 0 0 auto !important; min-width: auto !important;
      background: #1faa59; color: #fff; padding: 12px 16px !important;
      text-decoration: none; display: inline-flex; align-items: center;
    }
    .vazio {
      text-align: center; color: #6e6a62; padding: 60px 20px;
      font-size: 0.95rem;
    }
    .hora { font-size: 0.75rem; color: #6e6a62; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="topo">
    <h1>🍔 Painel — Sabor Local</h1>
    <span class="ao-vivo" id="statusConexao">conectando…</span>
  </div>

  <div id="pedidos" class="pedidos"></div>

  <script>
    const SUPABASE_URL = "https://avvgvzrnfjqofgfihibz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF2dmd2enJuZmpxb2ZnZmloaWJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwOTEzMTMsImV4cCI6MjEwNTY2NzMxM30.SozpWD35snTiYEnwslrktTT6lm5-ilNJ6tSCOtDqpU4";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const STATUS = {
      recebido: "Recebido",
      preparo: "Em preparo",
      a_caminho: "A caminho",
      entregue: "Entregue",
    };
    let pedidos = [];

    const $ = (s) => document.querySelector(s);

    function formatar(valor) {
      return Number(valor).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    /* ---------- Render ---------- */
    function renderizar() {
      // mais recentes primeiro; entregues vão pro final
      const ordenados = [...pedidos].sort((a, b) => {
        if (a.status === "entregue" && b.status !== "entregue") return 1;
        if (a.status !== "entregue" && b.status === "entregue") return -1;
        return new Date(b.created_at) - new Date(a.created_at);
      });

      if (ordenados.length === 0) {
        $("#pedidos").innerHTML = `<p class="vazio">Aguardando pedidos…<br /><small>Quando um cliente finalizar no cardápio, aparece aqui na hora.</small></p>`;
        return;
      }

      $("#pedidos").innerHTML = ordenados.map((p) => {
        const itens = (p.itens || [])
          .map((i) => `${i.qtd}x ${i.nome}`)
          .join(" • ");
        const proximo =
          p.status === "recebido" ? `<button class="btn-preparo" data-acao="preparo" data-id="${p.id}">🍳 Começar preparo</button>` :
          p.status === "preparo" ? `<button class="btn-caminho" data-acao="a_caminho" data-id="${p.id}">🛵 Despachar entrega</button>` :
          p.status === "a_caminho" ? `<button class="btn-entregue" data-acao="entregue" data-id="${p.id}">✅ Marcar entregue</button>` : "";

        return `
        <article class="pedido">
          <div class="pedido__cab">
            <span class="pedido__codigo">#${p.codigo}</span>
            <span class="badge badge--${p.status}">${STATUS[p.status]}</span>
          </div>
          <div class="pedido__info">
            <strong>${p.cliente_nome}</strong><br />
            📍 ${p.cliente_endereco}
            ${p.cliente_obs ? `<br />📝 ${p.cliente_obs}` : ""}
            ${p.pagamento ? `<br />💳 ${p.pagamento}${p.troco ? ` (troco: ${p.troco})` : ""}` : ""}
          </div>
          <div class="pedido__itens">${itens}</div>
          <div class="pedido__total">${formatar(p.total)}</div>
          <div class="pedido__acoes">
            ${proximo}
            <a class="btn-whatsapp" target="_blank"
               href="https://wa.me/?text=${encodeURIComponent(`Pedido #${p.codigo} — ${p.cliente_nome}: ${p.cliente_endereco}`)}">📲</a>
          </div>
          <div class="hora">Chegou às ${new Date(p.created_at).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}</div>
        </article>`;
      }).join("");

      document.querySelectorAll("[data-acao]").forEach((btn) => {
        btn.addEventListener("click", () => mudarStatus(btn.dataset.id, btn.dataset.acao));
      });
    }

    /* ---------- Ações ---------- */
    async function mudarStatus(id, status) {
      const { error } = await sb.from("pedidos").update({ status }).eq("id", id);
      if (error) alert("Erro: " + error.message);
    }

    /* ---------- Tempo real ---------- */
    async function carregar() {
      const { data, error } = await sb
        .from("pedidos")
        .select("*")
        .gte("created_at", new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString()) // últimas 24h
        .order("created_at", { ascending: false });
      if (!error) { pedidos = data || []; renderizar(); }
    }

    sb.channel("pedidos-loja")
      .on("postgres_changes", { event: "*", schema: "public", table: "pedidos" }, (mudanca) => {
        if (mudanca.eventType === "INSERT") {
          pedidos.unshift(mudanca.new);
          apitarNovoPedido();
        } else if (mudanca.eventType === "UPDATE") {
          const i = pedidos.findIndex((p) => p.id === mudanca.new.id);
          if (i >= 0) pedidos[i] = mudanca.new;
        } else if (mudanca.eventType === "DELETE") {
          pedidos = pedidos.filter((p) => p.id !== mudanca.old.id);
        }
        renderizar();
      })
      .subscribe((s) => {
        $("#statusConexao").textContent = s === "SUBSCRIBED" ? "ao vivo" : "conectando…";
      });

    /* Bipe simples quando chega pedido novo */
    function apitarNovoPedido() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const ganho = ctx.createGain();
        osc.connect(ganho); ganho.connect(ctx.destination);
        osc.frequency.value = 880;
        ganho.gain.setValueAtTime(0.15, ctx.currentTime);
        ganho.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.start(); osc.stop(ctx.currentTime + 0.5);
      } catch { /* sem som, tudo bem */ }
    }

    carregar();
  </script>
</body>
</html>
