<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1c1e" />
  <title>Painel da Loja — Pedidos ao vivo</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #12100e; color: #f2efe9;
      min-height: 100dvh;
    }
    .topo {
      position: sticky; top: 0; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 14px;
      background: #1c1a17; border-bottom: 1px solid #2e2a24;
    }
    .topo h1 { font-size: 1.15rem; }
    .topo .ao-vivo {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.78rem; color: #9a958c;
    }
    .topo .ao-vivo::before {
      content: ""; width: 8px; height: 8px; border-radius: 50%;
      background: #e63946; animation: pulsar 1.4s infinite;
    }
    @keyframes pulsar { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

    .pedidos {
      display: flex; flex-direction: column; gap: 14px;
      padding: 16px; max-width: 720px; margin: 0 auto;
    }
    .pedido {
      background: #1c1a17; border: 1px solid #2e2a24;
      border-radius: 18px; padding: 16px;
      animation: aparecer 0.3s ease;
    }
    @keyframes aparecer { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .pedido__cab { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
    .pedido__codigo { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.05em; }
    .badge {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      padding: 5px 12px; border-radius: 999px; white-space: nowrap;
    }
    .badge--recebido { background: #3a3325; color: #ffc94d; }
    .badge--preparo { background: #25324a; color: #7db2ff; }
    .badge--pronto { background: #3a2b12; color: #ff9d3d; }
    .badge--a_caminho { background: #24382a; color: #5fd68b; }
    .badge--entregue { background: #2b2b2b; color: #9a958c; }
    .pedido__info { font-size: 0.88rem; color: #c8c3ba; line-height: 1.5; }
    .pedido__info strong { color: #f2efe9; }
    .pedido__itens {
      margin: 10px 0; padding: 10px 12px;
      background: #12100e; border-radius: 12px;
      font-size: 0.85rem; color: #c8c3ba;
    }
    .pedido__total { font-size: 1.05rem; font-weight: 800; color: #5fd68b; }

    .pedido__acoes { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .pedido__acoes button, .pedido__acoes a.btn {
      flex: 1; min-width: 130px;
      border: none; border-radius: 12px; padding: 12px;
      font-size: 0.88rem; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: .15s;
      text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
    }
    .pedido__acoes button:active { transform: scale(.97); }
    .btn-preparo { background: #25324a; color: #7db2ff; }
    .btn-pronto { background: #3a2b12; color: #ff9d3d; }
    .btn-whatsapp { flex: 0 0 auto !important; min-width: auto !important; background: #1faa59; color: #fff; padding: 12px 16px !important; }

    /* escolha do motoboy */
    .motoboys { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .motoboys button {
      display: flex; justify-content: space-between; align-items: center;
      background: #12100e; border: 1px solid #2e2a24; color: #f2efe9;
      border-radius: 12px; padding: 12px 14px;
      font-size: 0.9rem; cursor: pointer; font-family: inherit;
    }
    .motoboys button:hover { border-color: #5fd68b; }
    .motoboys .moto-tag { font-size: 0.75rem; color: #9a958c; }
    .entrega-info {
      margin-top: 10px; padding: 10px 12px; border-radius: 12px;
      background: #12100e; font-size: 0.85rem; color: #c8c3ba;
    }
    .entrega-info strong { color: #f2efe9; }

    .vazio { text-align: center; color: #6e6a62; padding: 60px 20px; font-size: 0.95rem; }
    .hora { font-size: 0.75rem; color: #6e6a62; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="topo">
    <h1>🍔 Painel — Sabor Local</h1>
    <span class="ao-vivo" id="statusConexao">conectando…</span>
  </div>

  <div id="pedidos" class="pedidos"></div>

  <script>
    const SUPABASE_URL = "https://avvgvzrnfjqofgfihibz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF2dmd2enJuZmpxb2ZnZmloaWJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwOTEzMTMsImV4cCI6MjEwNTY2NzMxM30.SozpWD35snTiYEnwslrktTT6lm5-ilNJ6tSCOtDqpU4";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const STATUS = {
      recebido: "Recebido",
      preparo: "Em preparo",
      pronto: "Pronto p/ retirada",
      a_caminho: "A caminho",
      entregue: "Entregue",
    };
    const STATUS_ENTREGA = {
      aguardando: "⏳ Aguardando o motoboy pegar no balcão",
      a_caminho: "🛵 Motoboy a caminho do cliente",
      entregue: "✅ Entrega confirmada pelo motoboy",
    };

    let pedidos = [];
    let entregas = {};   // pedido_id -> entrega
    let motoboys = [];

    const $ = (s) => document.querySelector(s);
    const formatar = (v) => Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

    /* ---------- Dados ---------- */
    async function carregarTudo() {
      const [{ data: p }, { data: e }] = await Promise.all([
        sb.from("pedidos").select("*")
          .gte("created_at", new Date(Date.now() - 24 * 3600 * 1000).toISOString())
          .order("created_at", { ascending: false }),
        sb.from("entregas").select("*").gte("created_at", new Date(Date.now() - 24 * 3600 * 1000).toISOString()),
      ]);
      pedidos = p || [];
      entregas = Object.fromEntries((e || []).map((x) => [x.pedido_id, x]));
      renderizar();
    }

    async function carregarMotoboys() {
      const { data } = await sb.from("motoboys").select("*").eq("disponivel", true).order("nome");
      motoboys = data || [];
    }

    /* ---------- Render ---------- */
    function renderizar() {
      const ordenados = [...pedidos].sort((a, b) => {
        if (a.status === "entregue" && b.status !== "entregue") return 1;
        if (a.status !== "entregue" && b.status === "entregue") return -1;
        return new Date(b.created_at) - new Date(a.created_at);
      });

      if (ordenados.length === 0) {
        $("#pedidos").innerHTML = `<p class="vazio">Aguardando pedidos…<br /><small>Quando um cliente finalizar no cardápio, aparece aqui na hora.</small></p>`;
        return;
      }

      $("#pedidos").innerHTML = ordenados.map((p) => {
        const entrega = entregas[p.id];
        let acoes = "";

        if (p.status === "recebido") {
          acoes = `<button class="btn-preparo" data-acao="preparo" data-id="${p.id}">🍳 Começar preparo</button>`;
        } else if (p.status === "preparo") {
          acoes = `<button class="btn-pronto" data-acao="pronto" data-id="${p.id}">🛎️ Pronto — despachar</button>`;
        } else if (p.status === "pronto" && !entrega) {
          // escolher motoboy (1 clique)
          acoes = `
            <div class="motoboys">
              ${motoboys.map((m) => `
                <button data-despachar="${p.id}" data-motoboy="${m.id}">
                  <span>🛵 ${m.nome}</span><span class="moto-tag">${m.moto}</span>
                </button>`).join("")}
            </div>`;
        } else if (entrega) {
          const quem = entrega.entregador_nome || "motoboy";
          acoes = `
            <div class="entrega-info">
              <strong>${quem}</strong> — ${STATUS_ENTREGA[entrega.status] || entrega.status}
            </div>`;
        }

        const itens = (p.itens || []).map((i) => `${i.qtd}x ${i.nome}`).join(" • ");

        return `
        <article class="pedido">
          <div class="pedido__cab">
            <span class="pedido__codigo">#${p.codigo}</span>
            <span class="badge badge--${p.status}">${STATUS[p.status]}</span>
          </div>
          <div class="pedido__info">
            <strong>${p.cliente_nome}</strong><br />
            📍 ${p.cliente_endereco}
            ${p.cliente_obs ? `<br />📝 ${p.cliente_obs}` : ""}
            ${p.pagamento ? `<br />💳 ${p.pagamento}${p.troco ? ` (troco: ${p.troco})` : ""}` : ""}
          </div>
          <div class="pedido__itens">${itens}</div>
          <div class="pedido__total">${formatar(p.total)}</div>
          <div class="pedido__acoes">
            ${acoes}
            <a class="btn-whatsapp" target="_blank"
               href="https://wa.me/?text=${encodeURIComponent(`Pedido #${p.codigo} — ${p.cliente_nome}: ${p.cliente_endereco}`)}">📲</a>
          </div>
          <div class="hora">Chegou às ${new Date(p.created_at).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}</div>
        </article>`;
      }).join("");

      document.querySelectorAll("[data-acao]").forEach((btn) =>
        btn.addEventListener("click", () => mudarStatus(btn.dataset.id, btn.dataset.acao)));
      document.querySelectorAll("[data-despachar]").forEach((btn) =>
        btn.addEventListener("click", () => despachar(btn.dataset.despachar, btn.dataset.motoboy)));
    }

    /* ---------- Ações da loja: SÓ preparar e despachar ---------- */
    async function mudarStatus(id, status) {
      const { error } = await sb.from("pedidos").update({ status }).eq("id", id);
      if (error) alert("Erro: " + error.message);
    }

    async function despachar(pedidoId, motoboyId) {
      const pedido = pedidos.find((p) => p.id === pedidoId);
      const motoboy = motoboys.find((m) => m.id === motoboyId);
      if (!pedido || !motoboy) return;

      const { error } = await sb.from("entregas").insert({
        pedido_id: pedidoId,
        motoboy_id: motoboyId,
        entregador_nome: motoboy.nome,
        moto: motoboy.moto,
        status: "aguardando",
      });
      if (error) { alert("Erro ao despachar: " + error.message); return; }
      // o pedido continua "pronto"; vira "a_caminho" só quando o motoboy confirmar a retirada
    }

    /* ---------- Tempo real ---------- */
    sb.channel("painel-loja")
      .on("postgres_changes", { event: "*", schema: "public", table: "pedidos" }, (m) => {
        if (m.eventType === "INSERT") { pedidos.unshift(m.new); apitar(); carregarMotoboys(); }
        else if (m.eventType === "UPDATE") {
          const i = pedidos.findIndex((p) => p.id === m.new.id);
          if (i >= 0) pedidos[i] = m.new;
        } else {
          pedidos = pedidos.filter((p) => p.id !== m.old.id);
        }
        renderizar();
      })
      .on("postgres_changes", { event: "*", schema: "public", table: "entregas" }, (m) => {
        if (m.eventType === "DELETE") {
          for (const k in entregas) if (entregas[k].id === m.old.id) delete entregas[k];
        } else {
          entregas[m.new.pedido_id] = m.new;
        }
        renderizar();
      })
      .subscribe((s) => {
        $("#statusConexao").textContent = s === "SUBSCRIBED" ? "ao vivo" : "conectando…";
      });

    function apitar() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const ganho = ctx.createGain();
        osc.connect(ganho); ganho.connect(ctx.destination);
        osc.frequency.value = 880;
        ganho.gain.setValueAtTime(0.15, ctx.currentTime);
        ganho.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.start(); osc.stop(ctx.currentTime + 0.5);
      } catch { /* sem som, tudo bem */ }
    }

    carregarMotoboys();
    carregarTudo();
  </script>
</body>
</html>
