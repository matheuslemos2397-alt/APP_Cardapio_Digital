<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1faa59" />
  <title>Ponto B — Acompanhar Entrega</title>

  <!-- Mapa gratuito: Leaflet + OpenStreetMap -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- SDK do Supabase (tempo real). Só usado quando SUPABASE_URL estiver preenchida. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f6f4f0; color: #1c1c1e;
      min-height: 100dvh;
      display: flex; flex-direction: column;
    }
    .topo {
      padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 12px;
      background: #fff; border-bottom: 1px solid #e9e4db;
      display: flex; flex-direction: column; gap: 10px;
    }
    .topo h1 { font-size: 1.2rem; }
    .linha { display: flex; gap: 8px; }
    .linha input {
      flex: 1; border: 1px solid #e9e4db; border-radius: 12px;
      padding: 11px 14px; font-size: 0.95rem; font-family: inherit;
      background: #f6f4f0; text-transform: uppercase;
    }
    .linha input:focus { outline: 2px solid #1faa59; background: #fff; }
    .linha button {
      border: none; border-radius: 12px; padding: 0 18px;
      background: #1faa59; color: #fff; font-weight: 700;
      font-size: 0.9rem; cursor: pointer; font-family: inherit;
    }
    .linha button:active { transform: scale(.96); }
    .status {
      font-size: 0.8rem; color: #70706e;
    }
    .status.ativo { color: #157a3f; font-weight: 600; }
    #mapa { flex: 1; min-height: 55dvh; background: #e9e4db; }
    .marcador-moto {
      background: none !important;
      border: none !important;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35));
    }
    .aviso-demo {
      margin: 10px 16px; font-size: 0.75rem; color: #8a6d00;
      background: #fff8e0; border: 1px solid #ffe28a;
      border-radius: 12px; padding: 8px 12px;
    }
  </style>
</head>
<body>
  <div class="topo">
    <h1>🗺️ Acompanhar entrega</h1>
    <div class="linha">
      <input type="text" id="codigo" placeholder="Código da entrega (ex.: TESTE123)" maxlength="20" />
      <button id="btnAcompanhar">Acompanhar</button>
    </div>
    <div id="status" class="status">Digite o código e toque em Acompanhar</div>
  </div>

  <div id="avisoDemo" class="aviso-demo" hidden>
    ⚠️ <strong>Modo local:</strong> abra o <em>sender.html</em> com o mesmo código em outra
    aba deste mesmo navegador — o ponto mostrado é o <strong>GPS real</strong> do aparelho.
  </div>

  <div id="mapa"></div>

  <script>
    /* ============================================================
       CONFIG — mesmo preenchimento do sender.html
       ============================================================ */
    const SUPABASE_URL = "";
    const SUPABASE_ANON_KEY = "";
    const usarSupabase = SUPABASE_URL && SUPABASE_ANON_KEY;

    const $ = (s) => document.querySelector(s);
    const statusEl = $("#status");

    let mapa = null, marcador = null, canal = null, demoTimer = null;
    let ultimaPos = null; // pra calcular a direção e girar a moto

    /* Motinha em SVG — vira na direção do movimento */
    const SVG_MOTO = `
      <svg viewBox="0 0 64 64" width="48" height="48">
        <g transform="rotate(-90 32 32)">
          <!-- rodas -->
          <circle cx="16" cy="48" r="10" fill="#1c1c1e"/>
          <circle cx="50" cy="48" r="10" fill="#1c1c1e"/>
          <circle cx="16" cy="48" r="4.5" fill="#9a9a9a"/>
          <circle cx="50" cy="48" r="4.5" fill="#9a9a9a"/>
          <!-- garfo dianteiro + guidão -->
          <line x1="53" y1="44" x2="47" y2="26" stroke="#1c1c1e" stroke-width="4" stroke-linecap="round"/>
          <path d="M43 24 L47 22 L52 26" stroke="#1c1c1e" stroke-width="4" fill="none" stroke-linecap="round"/>
          <!-- farol -->
          <circle cx="50" cy="29" r="4" fill="#ffd60a" stroke="#1c1c1e" stroke-width="2"/>
          <!-- tanque + banco -->
          <path d="M22 32 Q32 24 42 30 L40 36 Q30 33 24 37 Z" fill="#1faa59"/>
          <rect x="10" y="32" width="14" height="6" rx="3" fill="#1c1c1e"/>
          <!-- motor -->
          <circle cx="30" cy="42" r="7" fill="#3a3a3c"/>
          <circle cx="30" cy="42" r="3" fill="#9a9a9a"/>
          <!-- escapamento -->
          <path d="M30 46 L18 50" stroke="#9a9a9a" stroke-width="4" stroke-linecap="round"/>
          <!-- quadro -->
          <path d="M16 46 L30 42 L50 46" stroke="#1faa59" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        </g>
      </svg>`;

    const iconeMoto = (rotacao) =>
      L.divIcon({
        className: "marcador-moto",
        html: `<div style="transform: rotate(${rotacao}deg); transition: transform .6s ease;">${SVG_MOTO}</div>`,
        iconSize: [48, 48],
        iconAnchor: [24, 24],
      });

    /* Direção (bearing) entre dois pontos, em graus */
    function direcaoEntre(a, b) {
      const rad = Math.PI / 180;
      const dLng = (b[1] - a[1]) * rad;
      const y = Math.sin(dLng) * Math.cos(b[0] * rad);
      const x =
        Math.cos(a[0] * rad) * Math.sin(b[0] * rad) -
        Math.sin(a[0] * rad) * Math.cos(b[0] * rad) * Math.cos(dLng);
      return (Math.atan2(y, x) * 180) / Math.PI; // 0° = norte, cresce no sentido horário
    }

    function setStatus(txt, ativo = false) {
      statusEl.textContent = txt;
      statusEl.classList.toggle("ativo", ativo);
    }

    function receberPosicao({ lat, lng }) {
      const novaPos = [lat, lng];
      const rotacao = ultimaPos && novaPos[0] !== ultimaPos[0]
        ? direcaoEntre(ultimaPos, novaPos)
        : 0;

      if (!marcador) {
        marcador = L.marker(novaPos, { icon: iconeMoto(0), title: "Entregador" }).addTo(mapa);
        mapa.setView(novaPos, 16);
      } else {
        marcador.setIcon(iconeMoto(rotacao));
        marcador.setLatLng(novaPos);
        mapa.panTo(novaPos, { animate: true });
      }
      ultimaPos = novaPos;
      setStatus("Atualizado às " + new Date().toLocaleTimeString("pt-BR"), true);
    }

    function parar() {
      if (canal) { canal.unsubscribe(); canal = null; }
      clearInterval(demoTimer);
    }

    function acompanhar() {
      const codigo = $("#codigo").value.trim().toUpperCase();
      if (!codigo) { setStatus("Digite um código primeiro"); return; }

      parar();

      if (!mapa) {
        mapa = L.map("mapa").setView([-3.1190, -60.0217], 13); // Manaus como padrão
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "© OpenStreetMap",
        }).addTo(mapa);
      }

      if (usarSupabase) {
        // TEMPO REAL via Supabase Broadcast
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        canal = sb.channel("rastreio-" + codigo);
        canal.on("broadcast", { event: "posicao" }, ({ payload }) => receberPosicao(payload));
        canal.subscribe((s) =>
          setStatus(s === "SUBSCRIBED" ? "Conectado — aguardando o entregador..." : "Conectando...", s === "SUBSCRIBED")
        );
      } else {
        // MODO SIMULAÇÃO: escuta o localStorage que o sender.html grava
        $("#avisoDemo").hidden = false;
        const chave = "rastreio-demo-" + codigo;
        const ler = () => {
          const dados = JSON.parse(localStorage.getItem(chave) || "null");
          if (dados) receberPosicao(dados);
          else setStatus("Aguardando o entregador enviar posição...");
        };
        window.addEventListener("storage", (e) => { if (e.key === chave) ler(); });
        demoTimer = setInterval(ler, 2000);
        ler();
      }
    }

    $("#btnAcompanhar").addEventListener("click", acompanhar);
  </script>
</body>
</html>
