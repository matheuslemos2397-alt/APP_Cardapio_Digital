<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1faa59" />
  <title>Ponto B — Acompanhar Entrega</title>

  <!-- Mapa gratuito: Leaflet + OpenStreetMap -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- SDK do Supabase (tempo real). Só usado quando SUPABASE_URL estiver preenchida. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f6f4f0; color: #1c1c1e;
      min-height: 100dvh;
      display: flex; flex-direction: column;
    }
    .topo {
      padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 12px;
      background: #fff; border-bottom: 1px solid #e9e4db;
      display: flex; flex-direction: column; gap: 10px;
    }
    .topo h1 { font-size: 1.2rem; }
    .linha { display: flex; gap: 8px; }
    .linha input {
      flex: 1; border: 1px solid #e9e4db; border-radius: 12px;
      padding: 11px 14px; font-size: 0.95rem; font-family: inherit;
      background: #f6f4f0; text-transform: uppercase;
    }
    .linha input:focus { outline: 2px solid #1faa59; background: #fff; }
    .linha button {
      border: none; border-radius: 12px; padding: 0 18px;
      background: #1faa59; color: #fff; font-weight: 700;
      font-size: 0.9rem; cursor: pointer; font-family: inherit;
    }
    .linha button:active { transform: scale(.96); }
    .status {
      font-size: 0.8rem; color: #70706e;
    }
    .status.ativo { color: #157a3f; font-weight: 600; }
    .status-pedido {
      font-size: 0.85rem; font-weight: 700; text-align: center;
      padding: 10px 14px; border-radius: 12px;
      background: #f6f4f0; color: #70706e;
    }
    .status-pedido.recebido { background: #fff4e0; color: #b07500; }
    .status-pedido.preparo { background: #e8f0ff; color: #2456c4; }
    .status-pedido.pronto { background: #fff0e0; color: #c45e00; }
    .status-pedido.a_caminho { background: #e7f7ee; color: #157a3f; }
    .status-pedido.entregue { background: #eee; color: #555; }
    #mapa { flex: 1; min-height: 55dvh; background: #e9e4db; }
    .marcador-moto {
      background: none !important;
      border: none !important;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35));
    }
    .aviso-demo {
      margin: 10px 16px; font-size: 0.75rem; color: #8a6d00;
      background: #fff8e0; border: 1px solid #ffe28a;
      border-radius: 12px; padding: 8px 12px;
    }
  </style>
</head>
<body>
  <div class="topo">
    <h1>🗺️ Acompanhar entrega</h1>
    <div class="linha">
      <input type="text" id="codigo" placeholder="Código da entrega (ex.: TESTE123)" maxlength="20" />
      <button id="btnAcompanhar">Acompanhar</button>
    </div>
    <div id="status" class="status">Digite o código e toque em Acompanhar</div>
    <div id="statusPedido" class="status-pedido" hidden></div>
  </div>

  <div id="avisoDemo" class="aviso-demo" hidden>
    ⚠️ <strong>Modo local:</strong> abra o <em>sender.html</em> com o mesmo código em outra
    aba deste mesmo navegador — o ponto mostrado é o <strong>GPS real</strong> do aparelho.
  </div>

  <div id="mapa"></div>

  <script>
    /* ============================================================
       CONFIG — mesmo preenchimento do sender.html
       ============================================================ */
    const SUPABASE_URL = "https://avvgvzrnfjqofgfihibz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF2dmd2enJuZmpxb2ZnZmloaWJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwOTEzMTMsImV4cCI6MjEwNTY2NzMxM30.SozpWD35snTiYEnwslrktTT6lm5-ilNJ6tSCOtDqpU4";
    const usarSupabase = SUPABASE_URL && SUPABASE_ANON_KEY;

    const $ = (s) => document.querySelector(s);
    const statusEl = $("#status");

    let mapa = null, marcador = null, canal = null, demoTimer = null;
    let ultimaPos = null; // pra calcular a direção e girar a moto

    /* Motinha (Twemoji 🏍️) embutida no código — não depende de internet.
       Cada modelo tem um filtro de cor. Novos modelos: adicione em MOTOS. */
    const SVG_MOTO = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#99AAB5" d="M6.5 24C3.462 24 1 26.463 1 29.5S3.462 35 6.5 35s5.5-2.463 5.5-5.5S9.538 24 6.5 24zm0 9C4.567 33 3 31.433 3 29.5S4.567 26 6.5 26s3.5 1.567 3.5 3.5S8.433 33 6.5 33zm23-9c-3.037 0-5.5 2.463-5.5 5.5s2.463 5.5 5.5 5.5 5.5-2.463 5.5-5.5-2.463-5.5-5.5-5.5zm0 9c-1.934 0-3.5-1.567-3.5-3.5s1.566-3.5 3.5-3.5 3.5 1.567 3.5 3.5-1.566 3.5-3.5 3.5z"/><path fill="#292F33" d="M6.5 22.914c-3.59 0-6.5 2.91-6.5 6.5s2.91 6.5 6.5 6.5 6.5-2.91 6.5-6.5-2.91-6.5-6.5-6.5zm0 11c-2.485 0-4.5-2.015-4.5-4.5s2.015-4.5 4.5-4.5 4.5 2.015 4.5 4.5-2.015 4.5-4.5 4.5zm23-11c-3.59 0-6.5 2.91-6.5 6.5s2.91 6.5 6.5 6.5 6.5-2.91 6.5-6.5-2.91-6.5-6.5-6.5zm0 11c-2.485 0-4.5-2.015-4.5-4.5s2.015-4.5 4.5-4.5 4.5 2.015 4.5 4.5-2.015 4.5-4.5 4.5z"/><path fill="#77B255" d="M7.001 27.051c-2 4 .999 2.587 1.999.587.905-1.811 3.444-2.429 4.66-.375C12.708 24.213 9.863 22 6.5 22c-1.374 0-2.657.375-3.764 1.02 2.833.165 5.366 1.831 4.265 4.031z"/><path fill="#99AAB5" d="M30 29c0 .553-.447 1-1 1h-9c-.553 0-1-.447-1-1 0-.553.447-1 1-1h9c.553 0 1 .447 1 1z"/><path fill="#99AAB5" d="M29.923 30.306c-.433.344-1.062.272-1.405-.161L22.917 23.1c-.344-.433-.271-1.062.16-1.405.433-.344 1.062-.272 1.405.161l5.601 7.045c.344.432.271 1.061-.16 1.405z"/><path fill="#CCD6DD" d="M12.463 20.367c.466.297.602.915.304 1.381L7.918 29.33c-.298.465-.916.602-1.381.303-.466-.297-.602-.915-.304-1.381l4.849-7.582c.298-.465.916-.602 1.381-.303z"/><path fill="#77B255" d="M10.529 17.368C9.718 17.953 6 19 9 21s5.094 4.125 5.094 6c0 2.665-.656 4 .906 4h7s-1-4 2-7 5-2 8-3c1.897-.633 4-2 4-3s0-2-2-1-1 1.551-3 .551-3.16.449-4.16.449-7.614 1.68-8.62-.049C17.667 17 16.434 16 14.616 16c-1.318 0-3.116.667-4.087 1.368z"/><path fill="#66757F" d="M21 29c0 1.104-.895 2-2 2-1.104 0-2-.896-2-2s.896-2 2-2c1.105 0 2 .896 2 2z"/><path fill="#CCD6DD" d="M25.8 27.975l9.277-3.732 1.12 2.783-9.278 3.732z"/><path fill="#FFF" d="M26.173 28.902l9.277-3.732.373.928-9.277 3.732z"/><path fill="#66757F" d="M26.546 29.83l9.277-3.731.373.927-9.277 3.732z"/><path fill="#292F33" d="M19 18.137c1.366.385 5.645-.007 6.802-.098 1.157-.09 1.594.451 0 1.25C24 20.19 20.188 22.45 19 22.914c-.998.391-4.5-1.211-4.917-1.696-.416-.486 3.745-3.411 4.917-3.081zM34 17c-1.549.04-3 0-4 0s-1.158 1.102 1.549 1.102S34 17 34 17z"/><path fill="#77B255" d="M3.736 16.958c0-1.465 4.456-5.134 3.975-4.476-1.15 1.573-.489 3.476 1.487 3.476S11.907 22.477 9 21c-2.907-1.477-5.264-3.323-5.264-4.042z"/><path fill="#CCD6DD" d="M8.606 10.569c.704.61.345 1.692-1.045 3.485-1.391 1.793-3.583 2.521-2.359.542s3.404-4.027 3.404-4.027z"/><path fill="#66757F" d="M10.529 17.368c-.19.476-.73.706-1.206.516l-.134-.054c-.476-.19-.707-.73-.516-1.206l.798-1.992c.19-.476.73-.707 1.206-.516l.135.054c.476.19.707.73.516 1.206l-.799 1.992z"/><path fill="#292F33" d="M12.911 13.991c.094.26-.04.546-.3.64l-1.881.679c-.26.094-.546-.041-.64-.301-.094-.26.04-.546.3-.64l1.881-.679c.26-.094.546.041.64.301z"/></svg>`;

    const MOTOS = {
      classica: { filtro: "none" },                                   // verde original
      esportiva: { filtro: "hue-rotate(264deg) saturate(2.4)" },      // vermelha esportiva
      street: { filtro: "hue-rotate(124deg) saturate(1.6)" },         // azul street
    };

    const iconeMoto = (rotacao, variante) => {
      const modelo = MOTOS[variante] || MOTOS.classica;
      return L.divIcon({
        className: "marcador-moto",
        html: `<div style="filter: ${modelo.filtro}; transform: rotate(${rotacao}deg);
                        transition: transform .6s ease;">${SVG_MOTO}</div>`,
        iconSize: [52, 52],
        iconAnchor: [26, 26],
      });
    };

    /* Direção (bearing) entre dois pontos, em graus */
    function direcaoEntre(a, b) {
      const rad = Math.PI / 180;
      const dLng = (b[1] - a[1]) * rad;
      const y = Math.sin(dLng) * Math.cos(b[0] * rad);
      const x =
        Math.cos(a[0] * rad) * Math.sin(b[0] * rad) -
        Math.sin(a[0] * rad) * Math.cos(b[0] * rad) * Math.cos(dLng);
      const graus = (Math.atan2(y, x) * 180) / Math.PI; // 0° = norte, horário
      // A moto do Twemoji aponta para a esquerda (oeste) — corrige -90°
      return (graus - 90 + 360) % 360;
    }

    function setStatus(txt, ativo = false) {
      statusEl.textContent = txt;
      statusEl.classList.toggle("ativo", ativo);
    }

    function receberPosicao({ lat, lng, moto }) {
      const novaPos = [lat, lng];
      const rotacao = ultimaPos && novaPos[0] !== ultimaPos[0]
        ? direcaoEntre(ultimaPos, novaPos)
        : 0;
      const modelo = moto || "classica";

      if (!marcador) {
        marcador = L.marker(novaPos, { icon: iconeMoto(0, modelo), title: "Entregador" }).addTo(mapa);
        mapa.setView(novaPos, 16);
      } else {
        marcador.setIcon(iconeMoto(rotacao, modelo));
        marcador.setLatLng(novaPos);
        mapa.panTo(novaPos, { animate: true });
      }
      ultimaPos = novaPos;
      setStatus("Atualizado às " + new Date().toLocaleTimeString("pt-BR"), true);
    }

    const TEXTO_STATUS = {
      recebido: "🟡 Pedido recebido pela loja",
      preparo: "🔵 Seu pedido está em preparo",
      pronto: "🟠 Pedido pronto — aguardando o entregador",
      a_caminho: "🟢 SAIU PARA ENTREGA — motinha a caminho!",
      entregue: "✅ Pedido entregue. Bom apetite!",
    };
    let canalStatus = null;

    function mostrarStatusPedido(status) {
      const el = $("#statusPedido");
      el.hidden = false;
      el.className = "status-pedido " + status;
      el.textContent = TEXTO_STATUS[status] || status;
    }

    async function acompanharStatusPedido(codigo) {
      if (canalStatus) { canalStatus.unsubscribe(); canalStatus = null; }

      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // status atual
      const { data } = await sb.from("pedidos").select("status").eq("codigo", codigo).maybeSingle();
      if (data) mostrarStatusPedido(data.status);

      // e atualiza ao vivo
      canalStatus = sb
        .channel("status-" + codigo)
        .on("postgres_changes", {
          event: "UPDATE", schema: "public", table: "pedidos",
          filter: "codigo=eq." + codigo,
        }, (m) => mostrarStatusPedido(m.new.status))
        .subscribe();
    }

    function parar() {
      if (canal) { canal.unsubscribe(); canal = null; }
      clearInterval(demoTimer);
    }

    function acompanhar() {
      const codigo = $("#codigo").value.trim().toUpperCase();
      if (!codigo) { setStatus("Digite um código primeiro"); return; }

      parar();

      if (!mapa) {
        mapa = L.map("mapa").setView([-3.1190, -60.0217], 13); // Manaus como padrão
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "© OpenStreetMap",
        }).addTo(mapa);
      }

      if (usarSupabase) {
        // TEMPO REAL via Supabase Broadcast
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        canal = sb.channel("rastreio-" + codigo);
        canal.on("broadcast", { event: "posicao" }, ({ payload }) => receberPosicao(payload));
        canal.subscribe((s) =>
          setStatus(s === "SUBSCRIBED" ? "Conectado — aguardando o entregador..." : "Conectando...", s === "SUBSCRIBED")
        );

        // STATUS DO PEDIDO (em preparo, a caminho, entregue…)
        acompanharStatusPedido(codigo);
      } else {
        // MODO SIMULAÇÃO: escuta o localStorage que o sender.html grava
        $("#avisoDemo").hidden = false;
        const chave = "rastreio-demo-" + codigo;
        const ler = () => {
          const dados = JSON.parse(localStorage.getItem(chave) || "null");
          if (dados) receberPosicao(dados);
          else setStatus("Aguardando o entregador enviar posição...");
        };
        window.addEventListener("storage", (e) => { if (e.key === chave) ler(); });
        demoTimer = setInterval(ler, 2000);
        ler();
      }
    }

    $("#btnAcompanhar").addEventListener("click", acompanhar);

    // Se abriu com ?codigo=1234 na URL (link do checkout), inicia sozinho
    const codigoDaUrl = new URLSearchParams(location.search).get("codigo");
    if (codigoDaUrl) {
      $("#codigo").value = codigoDaUrl.toUpperCase();
      acompanhar();
    }
  </script>
</body>
</html>
