<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1faa59" />
  <title>Rastreio — Teste de Geolocalização</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f6f4f0; color: #1c1c1e;
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; gap: 20px;
    }
    h1 { font-size: 1.4rem; text-align: center; }
    p.sub { color: #70706e; font-size: 0.9rem; text-align: center; max-width: 380px; }
    .opcoes { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 360px; }
    .opcoes a {
      display: flex; align-items: center; gap: 14px;
      background: #fff; border: 1px solid #e9e4db; border-radius: 18px;
      padding: 20px; text-decoration: none; color: inherit;
      box-shadow: 0 2px 10px rgba(28,25,20,0.07);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .opcoes a:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(28,25,20,0.13); }
    .opcoes .icone { font-size: 2rem; }
    .opcoes strong { display: block; font-size: 1.05rem; }
    .opcoes small { color: #70706e; font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>📍 Teste de Rastreio</h1>
  <p class="sub">Abra o <strong>Ponto A</strong> em um aparelho (o "entregador") e o <strong>Ponto B</strong> em outro (o "cliente"), usando o mesmo código.</p>
  <div class="opcoes">
    <a href="sender.html">
      <span class="icone">🛵</span>
      <span><strong>Ponto A — Entregador</strong><small>Compartilha minha localização</small></span>
    </a>
    <a href="viewer.html">
      <span class="icone">🗺️</span>
      <span><strong>Ponto B — Cliente</strong><small>Acompanhar entrega no mapa</small></span>
    </a>
  </div>
</body>
</html>
