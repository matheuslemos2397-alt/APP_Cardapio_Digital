<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1faa59" />
  <title>Ponto A — Entregador</title>

  <!-- SDK do Supabase (tempo real). Só usado quando SUPABASE_URL estiver preenchida. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f6f4f0; color: #1c1c1e;
      min-height: 100dvh; padding: 24px;
      display: flex; flex-direction: column; align-items: center; gap: 18px;
      max-width: 480px; margin: 0 auto;
    }
    h1 { font-size: 1.3rem; }
    .cartao {
      width: 100%; background: #fff; border: 1px solid #e9e4db;
      border-radius: 18px; padding: 20px;
      box-shadow: 0 2px 10px rgba(28,25,20,0.07);
      display: flex; flex-direction: column; gap: 12px;
    }
    label { font-size: 0.85rem; font-weight: 600; display: flex; flex-direction: column; gap: 6px; }
    input {
      border: 1px solid #e9e4db; border-radius: 12px; padding: 12px 14px;
      font-size: 1rem; font-family: inherit; background: #f6f4f0; text-transform: uppercase;
    }
    input:focus { outline: 2px solid #1faa59; background: #fff; }
    button {
      border: none; border-radius: 999px; padding: 14px; font-size: 1rem; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: .15s;
    }
    button:active { transform: scale(.97); }
    .btn-iniciar { background: #1faa59; color: #fff; box-shadow: 0 4px 14px rgba(31,170,89,.35); }
    .btn-parar { background: #e63946; color: #fff; display: none; }
    .status {
      font-size: 0.85rem; padding: 10px 14px; border-radius: 12px;
      background: #f6f4f0; color: #70706e; text-align: center;
    }
    .status.ativo { background: #e7f7ee; color: #157a3f; font-weight: 600; }
    .coords { font-family: ui-monospace, monospace; font-size: 0.8rem; color: #70706e; text-align: center; }
    .aviso-demo {
      font-size: 0.75rem; color: #8a6d00; background: #fff8e0;
      border: 1px solid #ffe28a; border-radius: 12px; padding: 10px 12px;
    }
    .voltar { color: #1faa59; font-size: 0.85rem; text-decoration: none; }
  </style>
</head>
<body>
  <h1>🛵 Ponto A — Entregador</h1>

  <div class="cartao">
    <label>
      Código da entrega
      <input type="text" id="codigo" placeholder="Ex.: TESTE123" maxlength="20" />
    </label>

    <button id="btnIniciar" class="btn-iniciar">▶ Iniciar rastreio</button>
    <button id="btnParar" class="btn-parar">■ Parar rastreio</button>

    <div id="status" class="status">Aguardando início</div>
    <div id="coords" class="coords">—</div>

    <div id="avisoDemo" class="aviso-demo" hidden>
      ⚠️ <strong>Modo local:</strong> Supabase ainda não configurado. Usando seu <strong>GPS real</strong>,
      transmitido entre abas deste mesmo navegador.
    </div>
  </div>

  <a class="voltar" href="index.html">← Voltar</a>

  <script>
    /* ============================================================
       CONFIG — cole aqui os dados do seu projeto Supabase
       (Supabase Dashboard → Settings → API). Deixe vazio para
       rodar em MODO SIMULAÇÃO (teste local, sem chave).
       ============================================================ */
    const SUPABASE_URL = "";       // ex.: "https://xyz.supabase.co"
    const SUPABASE_ANON_KEY = "";  // ex.: "eyJhbGciOi..."

    const usarSupabase = SUPABASE_URL && SUPABASE_ANON_KEY;

    const $ = (s) => document.querySelector(s);
    const statusEl = $("#status");
    const coordsEl = $("#coords");
    let rodando = false;
    let watchId = null;
    let demoTimer = null;
    let canal = null; // canal Supabase (broadcast)
    let sb = null;

    function setStatus(txt, ativo = false) {
      statusEl.textContent = txt;
      statusEl.classList.toggle("ativo", ativo);
    }

    function enviarPosicao(lat, lng) {
      const payload = { lat, lng, ts: Date.now() };

      if (usarSupabase && canal) {
        canal.send({ type: "broadcast", event: "posicao", payload });
      } else {
        // Modo simulação: grava no localStorage — a aba do "cliente"
        // (mesmo navegador) escuta a mudança. Mesma ideia do Realtime.
        localStorage.setItem("rastreio-demo-" + $("#codigo").value.trim().toUpperCase(), JSON.stringify(payload));
      }

      coordsEl.textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
    }

    function iniciar() {
      const codigo = $("#codigo").value.trim().toUpperCase();
      if (!codigo) { setStatus("Digite um código primeiro"); return; }

      if (usarSupabase) {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        canal = sb.channel("rastreio-" + codigo);
        canal.subscribe((s) => setStatus(s === "SUBSCRIBED" ? "Rastreio ativo (Supabase)" : "Conectando...", s === "SUBSCRIBED"));
        $("#avisoDemo").hidden = true;
      } else {
        $("#avisoDemo").hidden = false;
      }

      if (navigator.geolocation && usarSupabase) {
        watchId = navigator.geolocation.watchPosition(
          (pos) => enviarPosicao(pos.coords.latitude, pos.coords.longitude),
          (erro) => setStatus("Erro no GPS: " + erro.message),
          { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
        );
      } else if (usarSupabase) {
        setStatus("Este aparelho não tem GPS");
        return;
      } else if (navigator.geolocation) {
        // Modo teste SEM Supabase: usa o GPS REAL e grava no localStorage
        // (a aba do cliente no mesmo navegador escuta a mudança).
        setStatus("Rastreio ativo (GPS real, modo local)", true);
        watchId = navigator.geolocation.watchPosition(
          (pos) => enviarPosicao(pos.coords.latitude, pos.coords.longitude),
          (erro) => setStatus("Erro no GPS: " + erro.message),
          { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
        );
      } else {
        // Último recurso: aparelho sem GPS → rota simulada em Manaus
        setStatus("Sem GPS no aparelho — usando simulação");
        let lat = -3.1190, lng = -60.0217, passo = 0;
        demoTimer = setInterval(() => {
          passo += 0.0004;
          enviarPosicao(lat + Math.sin(passo) * 0.01, lng + passo * 0.9);
        }, 2000);
      }

      rodando = true;
      $("#btnIniciar").style.display = "none";
      $("#btnParar").style.display = "block";
    }

    function parar() {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      clearInterval(demoTimer);
      if (canal) { canal.unsubscribe(); canal = null; }
      rodando = false;
      setStatus("Rastreio parado");
      coordsEl.textContent = "—";
      $("#btnIniciar").style.display = "block";
      $("#btnIniciar").textContent = "▶ Retomar rastreio";
      $("#btnParar").style.display = "none";
    }

    $("#btnIniciar").addEventListener("click", iniciar);
    $("#btnParar").addEventListener("click", parar);
  </script>
</body>
</html>
