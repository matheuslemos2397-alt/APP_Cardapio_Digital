<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1faa59" />
  <title>Ponto A — Entregador</title>

  <!-- SDK do Supabase (tempo real). Só usado quando SUPABASE_URL estiver preenchida. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f6f4f0; color: #1c1c1e;
      min-height: 100dvh; padding: 24px;
      display: flex; flex-direction: column; align-items: center; gap: 18px;
      max-width: 480px; margin: 0 auto;
    }
    h1 { font-size: 1.3rem; }
    .cartao {
      width: 100%; background: #fff; border: 1px solid #e9e4db;
      border-radius: 18px; padding: 20px;
      box-shadow: 0 2px 10px rgba(28,25,20,0.07);
      display: flex; flex-direction: column; gap: 12px;
    }
    label { font-size: 0.85rem; font-weight: 600; display: flex; flex-direction: column; gap: 6px; }
    input {
      border: 1px solid #e9e4db; border-radius: 12px; padding: 12px 14px;
      font-size: 1rem; font-family: inherit; background: #f6f4f0; text-transform: uppercase;
    }
    input:focus { outline: 2px solid #1faa59; background: #fff; }
    button {
      border: none; border-radius: 999px; padding: 14px; font-size: 1rem; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: .15s;
    }
    button:active { transform: scale(.97); }
    .btn-iniciar { background: #1faa59; color: #fff; box-shadow: 0 4px 14px rgba(31,170,89,.35); }
    .btn-parar { background: #e63946; color: #fff; display: none; }
    .status {
      font-size: 0.85rem; padding: 10px 14px; border-radius: 12px;
      background: #f6f4f0; color: #70706e; text-align: center;
    }
    .status.ativo { background: #e7f7ee; color: #157a3f; font-weight: 600; }
    .coords { font-family: ui-monospace, monospace; font-size: 0.8rem; color: #70706e; text-align: center; }
    .aviso-demo {
      font-size: 0.75rem; color: #8a6d00; background: #fff8e0;
      border: 1px solid #ffe28a; border-radius: 12px; padding: 10px 12px;
    }
    .voltar { color: #1faa59; font-size: 0.85rem; text-decoration: none; }
    .motos { display: flex; gap: 8px; }
    .motos button {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
      background: #f6f4f0; border: 2px solid #e9e4db; border-radius: 14px;
      padding: 10px 4px; font-size: 1.6rem; cursor: pointer; transition: .15s;
    }
    .motos button img { width: 42px; height: 42px; }
    .moto-icone { display: block; width: 42px; height: 42px; }
    .moto-icone svg { width: 100%; height: 100%; }
    .motos button small { font-size: 0.7rem; color: #70706e; }
    .motos button.selecionada {
      border-color: #1faa59; background: #e7f7ee;
      box-shadow: 0 4px 12px rgba(31, 170, 89, 0.25);
    }
  </style>
</head>
<body>
  <h1>🛵 Ponto A — Entregador</h1>

  <div class="cartao">
    <label>
      Código da entrega
      <input type="text" id="codigo" placeholder="Ex.: TESTE123" maxlength="20" />
    </label>

    <label>
      Escolha sua motinha
      <div class="motos" id="motos">
        <button type="button" data-moto="classica" class="selecionada">
          <span class="moto-icone" data-filtro="none"></span><small>Clássica</small>
        </button>
        <button type="button" data-moto="esportiva">
          <span class="moto-icone" data-filtro="hue-rotate(264deg) saturate(2.4)"></span><small>Esportiva</small>
        </button>
        <button type="button" data-moto="street">
          <span class="moto-icone" data-filtro="hue-rotate(124deg) saturate(1.6)"></span><small>Street</small>
        </button>
      </div>
    </label>

    <button id="btnIniciar" class="btn-iniciar">▶ Iniciar rastreio</button>
    <button id="btnParar" class="btn-parar">■ Parar rastreio</button>

    <div id="status" class="status">Aguardando início</div>
    <div id="coords" class="coords">—</div>

    <div id="avisoDemo" class="aviso-demo" hidden>
      ⚠️ <strong>Modo local:</strong> Supabase ainda não configurado. Usando seu <strong>GPS real</strong>,
      transmitido entre abas deste mesmo navegador.
    </div>
  </div>

  <a class="voltar" href="index.html">← Voltar</a>

  <script>
    /* ============================================================
       CONFIG — cole aqui os dados do seu projeto Supabase
       (Supabase Dashboard → Settings → API). Deixe vazio para
       rodar em MODO SIMULAÇÃO (teste local, sem chave).
       ============================================================ */
    const SUPABASE_URL = "";       // ex.: "https://xyz.supabase.co"
    const SUPABASE_ANON_KEY = "";  // ex.: "eyJhbGciOi..."

    const usarSupabase = SUPABASE_URL && SUPABASE_ANON_KEY;

    const $ = (s) => document.querySelector(s);
    const statusEl = $("#status");
    const coordsEl = $("#coords");
    let rodando = false;
    let motoEscolhida = "classica";
    let watchId = null;
    let demoTimer = null;
    let canal = null; // canal Supabase (broadcast)
    let sb = null;

    function setStatus(txt, ativo = false) {
      statusEl.textContent = txt;
      statusEl.classList.toggle("ativo", ativo);
    }

    function enviarPosicao(lat, lng) {
      const payload = { lat, lng, ts: Date.now(), moto: motoEscolhida };

      if (usarSupabase && canal) {
        canal.send({ type: "broadcast", event: "posicao", payload });
      } else {
        // Modo simulação: grava no localStorage — a aba do "cliente"
        // (mesmo navegador) escuta a mudança. Mesma ideia do Realtime.
        localStorage.setItem("rastreio-demo-" + $("#codigo").value.trim().toUpperCase(), JSON.stringify(payload));
      }

      coordsEl.textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
    }

    function iniciar() {
      const codigo = $("#codigo").value.trim().toUpperCase();
      if (!codigo) { setStatus("Digite um código primeiro"); return; }

      if (usarSupabase) {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        canal = sb.channel("rastreio-" + codigo);
        canal.subscribe((s) => setStatus(s === "SUBSCRIBED" ? "Rastreio ativo (Supabase)" : "Conectando...", s === "SUBSCRIBED"));
        $("#avisoDemo").hidden = true;
      } else {
        $("#avisoDemo").hidden = false;
      }

      if (navigator.geolocation && usarSupabase) {
        watchId = navigator.geolocation.watchPosition(
          (pos) => enviarPosicao(pos.coords.latitude, pos.coords.longitude),
          (erro) => setStatus("Erro no GPS: " + erro.message),
          { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
        );
      } else if (usarSupabase) {
        setStatus("Este aparelho não tem GPS");
        return;
      } else if (navigator.geolocation) {
        // Modo teste SEM Supabase: usa o GPS REAL e grava no localStorage
        // (a aba do cliente no mesmo navegador escuta a mudança).
        setStatus("Rastreio ativo (GPS real, modo local)", true);
        watchId = navigator.geolocation.watchPosition(
          (pos) => enviarPosicao(pos.coords.latitude, pos.coords.longitude),
          (erro) => setStatus("Erro no GPS: " + erro.message),
          { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
        );
      } else {
        // Último recurso: aparelho sem GPS → rota simulada em Manaus
        setStatus("Sem GPS no aparelho — usando simulação");
        let lat = -3.1190, lng = -60.0217, passo = 0;
        demoTimer = setInterval(() => {
          passo += 0.0004;
          enviarPosicao(lat + Math.sin(passo) * 0.01, lng + passo * 0.9);
        }, 2000);
      }

      rodando = true;
      $("#btnIniciar").style.display = "none";
      $("#btnParar").style.display = "block";
    }

    function parar() {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      clearInterval(demoTimer);
      if (canal) { canal.unsubscribe(); canal = null; }
      rodando = false;
      setStatus("Rastreio parado");
      coordsEl.textContent = "—";
      $("#btnIniciar").style.display = "block";
      $("#btnIniciar").textContent = "▶ Retomar rastreio";
      $("#btnParar").style.display = "none";
    }

    // Desenha as motinhas do seletor (SVG embutido — sem depender de internet)
    const SVG_MOTO = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#99AAB5" d="M6.5 24C3.462 24 1 26.463 1 29.5S3.462 35 6.5 35s5.5-2.463 5.5-5.5S9.538 24 6.5 24zm0 9C4.567 33 3 31.433 3 29.5S4.567 26 6.5 26s3.5 1.567 3.5 3.5S8.433 33 6.5 33zm23-9c-3.037 0-5.5 2.463-5.5 5.5s2.463 5.5 5.5 5.5 5.5-2.463 5.5-5.5-2.463-5.5-5.5-5.5zm0 9c-1.934 0-3.5-1.567-3.5-3.5s1.566-3.5 3.5-3.5 3.5 1.567 3.5 3.5-1.566 3.5-3.5 3.5z"/><path fill="#292F33" d="M6.5 22.914c-3.59 0-6.5 2.91-6.5 6.5s2.91 6.5 6.5 6.5 6.5-2.91 6.5-6.5-2.91-6.5-6.5-6.5zm0 11c-2.485 0-4.5-2.015-4.5-4.5s2.015-4.5 4.5-4.5 4.5 2.015 4.5 4.5-2.015 4.5-4.5 4.5zm23-11c-3.59 0-6.5 2.91-6.5 6.5s2.91 6.5 6.5 6.5 6.5-2.91 6.5-6.5-2.91-6.5-6.5-6.5zm0 11c-2.485 0-4.5-2.015-4.5-4.5s2.015-4.5 4.5-4.5 4.5 2.015 4.5 4.5-2.015 4.5-4.5 4.5z"/><path fill="#77B255" d="M7.001 27.051c-2 4 .999 2.587 1.999.587.905-1.811 3.444-2.429 4.66-.375C12.708 24.213 9.863 22 6.5 22c-1.374 0-2.657.375-3.764 1.02 2.833.165 5.366 1.831 4.265 4.031z"/><path fill="#99AAB5" d="M30 29c0 .553-.447 1-1 1h-9c-.553 0-1-.447-1-1 0-.553.447-1 1-1h9c.553 0 1 .447 1 1z"/><path fill="#99AAB5" d="M29.923 30.306c-.433.344-1.062.272-1.405-.161L22.917 23.1c-.344-.433-.271-1.062.16-1.405.433-.344 1.062-.272 1.405.161l5.601 7.045c.344.432.271 1.061-.16 1.405z"/><path fill="#CCD6DD" d="M12.463 20.367c.466.297.602.915.304 1.381L7.918 29.33c-.298.465-.916.602-1.381.303-.466-.297-.602-.915-.304-1.381l4.849-7.582c.298-.465.916-.602 1.381-.303z"/><path fill="#77B255" d="M10.529 17.368C9.718 17.953 6 19 9 21s5.094 4.125 5.094 6c0 2.665-.656 4 .906 4h7s-1-4 2-7 5-2 8-3c1.897-.633 4-2 4-3s0-2-2-1-1 1.551-3 .551-3.16.449-4.16.449-7.614 1.68-8.62-.049C17.667 17 16.434 16 14.616 16c-1.318 0-3.116.667-4.087 1.368z"/><path fill="#66757F" d="M21 29c0 1.104-.895 2-2 2-1.104 0-2-.896-2-2s.896-2 2-2c1.105 0 2 .896 2 2z"/><path fill="#CCD6DD" d="M25.8 27.975l9.277-3.732 1.12 2.783-9.278 3.732z"/><path fill="#FFF" d="M26.173 28.902l9.277-3.732.373.928-9.277 3.732z"/><path fill="#66757F" d="M26.546 29.83l9.277-3.731.373.927-9.277 3.732z"/><path fill="#292F33" d="M19 18.137c1.366.385 5.645-.007 6.802-.098 1.157-.09 1.594.451 0 1.25C24 20.19 20.188 22.45 19 22.914c-.998.391-4.5-1.211-4.917-1.696-.416-.486 3.745-3.411 4.917-3.081zM34 17c-1.549.04-3 0-4 0s-1.158 1.102 1.549 1.102S34 17 34 17z"/><path fill="#77B255" d="M3.736 16.958c0-1.465 4.456-5.134 3.975-4.476-1.15 1.573-.489 3.476 1.487 3.476S11.907 22.477 9 21c-2.907-1.477-5.264-3.323-5.264-4.042z"/><path fill="#CCD6DD" d="M8.606 10.569c.704.61.345 1.692-1.045 3.485-1.391 1.793-3.583 2.521-2.359.542s3.404-4.027 3.404-4.027z"/><path fill="#66757F" d="M10.529 17.368c-.19.476-.73.706-1.206.516l-.134-.054c-.476-.19-.707-.73-.516-1.206l.798-1.992c.19-.476.73-.707 1.206-.516l.135.054c.476.19.707.73.516 1.206l-.799 1.992z"/><path fill="#292F33" d="M12.911 13.991c.094.26-.04.546-.3.64l-1.881.679c-.26.094-.546-.041-.64-.301-.094-.26.04-.546.3-.64l1.881-.679c.26-.094.546.041.64.301z"/></svg>`;

    document.querySelectorAll(".moto-icone").forEach((el) => {
      el.innerHTML = SVG_MOTO;
      el.style.filter = el.dataset.filtro;
    });

    // Escolha da motinha
    document.querySelectorAll("#motos button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#motos button").forEach((b) => b.classList.remove("selecionada"));
        btn.classList.add("selecionada");
        motoEscolhida = btn.dataset.moto;
      });
    });

    $("#btnIniciar").addEventListener("click", iniciar);
    $("#btnParar").addEventListener("click", parar);
  </script>
</body>
</html>
